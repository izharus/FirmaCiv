
modLoader="javafml"
loaderVersion="[4,)"
license="MIT"
[[mods]]
modId="firmaciv"
version="${version}"
displayName="Firma: Civilization"
logoFile="icon.png"
authors="alekiponi"
credits = "Contributors: alekiponi, Traister101, EERussianGuy"
description='''
Firma: Civilization is an addon/expansion for TerraFirmaCraft focusing on key, civilization-building technologies missing from the base mod.

'''
[[dependencies.firmaciv]]
    modId="neoforge" #mandatory
    # Does this dependency have to exist - if not, ordering below must be specified
    type="required" #mandatory
    # The version range of the dependency
    versionRange="[21.1.234,)" #mandatory
    # An ordering relationship for the dependency - BEFORE or AFTER required if the relationship is not mandatory
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT or SERVER
    side="BOTH"
# Here's another dependency
[[dependencies.firmaciv]]
    modId="minecraft"
    type="required"
# This version range declares a minimum of the current minecraft version up to but not including the next major version
    versionRange="[1.21.1]"
    ordering="NONE"
    side="BOTH"


[[dependencies.firmaciv]]
    modId="tfc"
    type="required"
    versionRange="[4.2.15,4.3)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.firmaciv]]
    modId = "alekiships"
    type = "required"
    versionRange = "[2.0.0,3)"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config="firmaciv.mixins.json"
