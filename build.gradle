plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'com.alekiponi'
version = modVersion
base.archivesName = "FirmaCivilization-${minecraftVersion}"
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets { gameTest }
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}
dependencies { gameTestImplementation sourceSets.main.output }

neoForge {
    version = neoForgeVersion
    addModdingDependenciesTo sourceSets.gameTest
    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }
    runs {
        client {
            client()
            gameDirectory = file('run/client')
            if (providers.gradleProperty('portSmokeTest').isPresent()) {
                programArguments.addAll('--quickPlaySingleplayer', 'FirmaCivPortSmoke')
                systemProperty 'firmaciv.smokeTest', 'true'
            }
        }
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gameTest
            systemProperty 'neoforge.enabledGameTestNamespaces', 'firmaciv'
            systemProperty 'neoforge.gameTestServer', 'true'
            gameDirectory = file("run/gametest")
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
    }
    mods {
        firmaciv {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
    ivy {
        url = 'https://github.com/TerraFirmaCraft/TerraFirmaCraft/releases/download'
        patternLayout { artifact 'v[revision]/TerraFirmaCraft-NeoForge-1.21.1-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeModule 'net.dries007.tfc', 'TerraFirmaCraft' }
    }
}

def shipsJar = file(providers.gradleProperty('alekiShipsJar').getOrElse("../alekiships/build/libs/aleki's Nifty Ships-mc1.21.1-2.0.0.jar"))
if (!shipsJar.isFile()) {
    throw new GradleException("Build AlekiShips 2.0.0 for 1.21.1 or pass -PalekiShipsJar=/path/to/alekiships.jar")
}

dependencies {
    implementation "net.dries007.tfc:TerraFirmaCraft:${tfcVersion}@jar"
    implementation files(shipsJar)
    runtimeOnly 'vazkii.patchouli:Patchouli:1.21.1-92-NEOFORGE'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.25.0.321'
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.25.0.321'
    runtimeOnly 'mezz.jei:jei-1.21.1-neoforge:19.25.0.321'
    implementation 'curse.maven:jade-324717:5591256'
}

sourceSets.main.resources.srcDir 'src/generated/resources'
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

// The smoke test only replaces its own disposable world, never a player's save.
tasks.register('preparePortSmokeWorld', Sync) {
    from('run/gametest/world') { include 'level.dat' }
    into('run/client/saves/FirmaCivPortSmoke')
    doFirst {
        if (!file('run/gametest/world/level.dat').isFile()) {
            throw new GradleException('Run runGameTestServer before the client smoke test.')
        }
    }
}
if (providers.gradleProperty('portSmokeTest').isPresent()) {
    tasks.named('runClient') { dependsOn 'preparePortSmokeWorld' }
}
tasks.named('jar') {
    from(files('LICENSE.txt', 'THIRD_PARTY_NOTICES.md')) { into 'META-INF' }
}
